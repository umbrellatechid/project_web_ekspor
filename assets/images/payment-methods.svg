<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 24" fill="none">
  <!-- Card 1: VISA style -->
  <rect x="2" y="2" width="34" height="20" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="19" y="16" font-family="Inter, sans-serif" font-size="8" font-weight="900" fill="#f8fafc" text-anchor="middle" font-style="italic">VISA</text>

  <!-- Card 2: Mastercard style -->
  <rect x="42" y="2" width="34" height="20" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="55" cy="12" r="6" fill="#ef4444" opacity="0.8"/>
  <circle cx="63" cy="12" r="6" fill="#f59e0b" opacity="0.8"/>

  <!-- Card 3: Wire / Swift style -->
  <rect x="82" y="2" width="34" height="20" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="99" y="15" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#38bdf8" text-anchor="middle">SWIFT</text>

  <!-- Card 4: Escrow / L/C -->
  <rect x="122" y="2" width="34" height="20" rx="3" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="139" y="15" font-family="Inter, sans-serif" font-size="7" font-weight="700" fill="#10b981" text-anchor="middle">L/C B2B</text>
</svg>
