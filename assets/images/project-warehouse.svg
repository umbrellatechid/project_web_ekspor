<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" fill="none">
  <rect width="380" height="240" fill="#f1f5f9"/>
  <rect x="20" y="20" width="340" height="200" rx="4" fill="#0f172a"/>
  <!-- Warehouse Storage Bay & Racks -->
  <line x1="50" y1="40" x2="50" y2="180" stroke="#334155" stroke-width="3"/>
  <line x1="140" y1="40" x2="140" y2="180" stroke="#334155" stroke-width="3"/>
  <line x1="230" y1="40" x2="230" y2="180" stroke="#334155" stroke-width="3"/>
  <line x1="320" y1="40" x2="320" y2="180" stroke="#334155" stroke-width="3"/>

  <!-- Shelves -->
  <line x1="50" y1="80" x2="320" y2="80" stroke="#475569" stroke-width="2"/>
  <line x1="50" y1="130" x2="320" y2="130" stroke="#475569" stroke-width="2"/>
  <line x1="50" y1="180" x2="320" y2="180" stroke="#475569" stroke-width="2"/>

  <!-- Pallets & Boxes -->
  <rect x="65" y="55" width="60" height="25" rx="2" fill="#0284c7"/>
  <rect x="155" y="55" width="60" height="25" rx="2" fill="#d97706"/>
  <rect x="245" y="55" width="60" height="25" rx="2" fill="#0284c7"/>

  <rect x="65" y="105" width="60" height="25" rx="2" fill="#475569"/>
  <rect x="155" y="105" width="60" height="25" rx="2" fill="#0284c7"/>
  <rect x="245" y="105" width="60" height="25" rx="2" fill="#d97706"/>

  <text x="190" y="208" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1">BONDED WAREHOUSE FACILITY</text>
</svg>
