<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <rect width="400" height="500" fill="#0f172a"/>
  <!-- Logistics Supervisor & Container Illustration -->
  <rect x="40" y="60" width="320" height="380" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <!-- Shipping Containers Stacking -->
  <rect x="70" y="110" width="120" height="60" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="90" y1="110" x2="90" y2="170" stroke="#0369a1" stroke-width="2"/>
  <line x1="110" y1="110" x2="110" y2="170" stroke="#0369a1" stroke-width="2"/>
  <line x1="130" y1="110" x2="130" y2="170" stroke="#0369a1" stroke-width="2"/>
  <line x1="150" y1="110" x2="150" y2="170" stroke="#0369a1" stroke-width="2"/>

  <rect x="210" y="110" width="120" height="60" rx="3" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
  <line x1="230" y1="110" x2="230" y2="170" stroke="#1e293b" stroke-width="2"/>
  <line x1="250" y1="110" x2="250" y2="170" stroke="#1e293b" stroke-width="2"/>
  <line x1="270" y1="110" x2="270" y2="170" stroke="#1e293b" stroke-width="2"/>
  <line x1="290" y1="110" x2="290" y2="170" stroke="#1e293b" stroke-width="2"/>

  <!-- Cargo Crane -->
  <line x1="200" y1="80" x2="200" y2="280" stroke="#f59e0b" stroke-width="3"/>
  <line x1="140" y1="80" x2="260" y2="80" stroke="#f59e0b" stroke-width="3"/>

  <!-- Supervisor Avatar Silhouette -->
  <circle cx="200" cy="330" r="30" fill="#38bdf8"/>
  <path d="M150 410 C150 375 170 370 200 370 C230 370 250 375 250 410" fill="#0284c7"/>
  <text x="200" y="445" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="1">PORT DISPATCH SUPERVISION</text>
</svg>
